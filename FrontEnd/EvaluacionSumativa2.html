<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ES2 - Quispe</title>
    <link rel="stylesheet" href="css/stylees2.css">
    <script type="text/javascript" src="js/scriptes2.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>

<div class="contenedor">

    <body onload="cargarInferior()">
        <label for="inferior">Cota Inferior</label>

        <select id="inferior" >
            <option>Escoge la cantidad</option>
        </select>
    </body>
    
    <body onload="cargarSuperior()">
        <label for="superior">Cota Superior</label>
        
        <select id="superior">
            <option>Escoge la cantidad</option>
        </select>
    </body>
    <div class="checks">
        <label>
            <input type="checkbox" checked>
            Cantidad de Elementos de la Serie
        </label>

        <label>
            <input type="checkbox" checked>
            Promedio de todos los elementos de la Serie
        </label>

        <label>
            <input type="checkbox" checked>
            Números pares dentro de la Serie
        </label>
    </div>

    <input type="button" value="Mostrar Datos" name="ver" onclick="verMiembroVentana();">

</div>

</body>
</html>
</html>
